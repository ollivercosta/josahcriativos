<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo: mosaico de projetos</title>
<style>
@font-face{font-family:"Archivo";src:url("/assets/fontes/archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}
:root{--tinta:#16130f;--vermelho:#a3171f;--cinza:#f3f2ef;--suave:rgba(22,19,15,.62);--linha:rgba(22,19,15,.14);--margem:4.4vw;--curva:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--tinta);font-family:"Archivo",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.mosaico{padding:clamp(80px,12vh,140px) var(--margem)}

/* a grade: todas as células são quadrados do mesmo tamanho */
.mosaico__grade{--colunas:12;--vao:6px;--celula:calc((100% - (var(--colunas) - 1) * var(--vao)) / var(--colunas));display:grid;grid-template-columns:repeat(var(--colunas),minmax(0,1fr));grid-auto-rows:auto;gap:var(--vao);position:relative}
.mosaico__grade>*{aspect-ratio:1;min-width:0}

/* letras */
.mosaico__letra{display:grid;place-items:center;overflow:hidden;container-type:inline-size;opacity:0;transform:translateY(14px);transition:opacity .8s var(--curva),transform .8s var(--curva)}
.mosaico__letra span{font-weight:800;font-stretch:112%;font-size:96cqw;line-height:.74;letter-spacing:-.04em;transform:translateY(4%)}
.mosaico__letra--vermelho{background:var(--vermelho);color:#fff}
.mosaico__letra--tinta{background:var(--tinta);color:#fff}
.mosaico__letra--cinza{background:var(--cinza);color:var(--tinta)}

/* projetos */
.mosaico__projeto{position:relative;display:block;overflow:hidden;background:var(--cinza);opacity:0;transform:translateY(14px);transition:opacity .8s var(--curva),transform .8s var(--curva);outline:none}
.mosaico__projeto img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.06);transform:scale(1.02);transition:filter .6s var(--curva),transform 1s var(--curva)}
.mosaico__projeto::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 0 var(--vermelho);transition:box-shadow .5s var(--curva)}
.mosaico__projeto.ativo img{filter:none;transform:scale(1.08)}
.mosaico__projeto.ativo::after{box-shadow:inset 0 0 0 3px var(--vermelho)}
.mosaico__projeto:focus-visible::after{box-shadow:inset 0 0 0 3px var(--tinta)}

/* retrato: ocupa 2 x 2, o fundo branco some sobre o cinza e a cabeça passa da borda */
.mosaico__retrato{position:relative;clip-path:inset(-40% 0 0 0);aspect-ratio:1;background:var(--cinza);opacity:0;transition:opacity 1s var(--curva)}
.mosaico__retrato img{position:absolute;left:50%;bottom:0;height:118%;width:auto;transform:translateX(-50%);mix-blend-mode:multiply;pointer-events:none}

/* título dentro da grade */
.mosaico__titulo{aspect-ratio:auto!important;align-self:end;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding-bottom:4px;opacity:0;transition:opacity 1s var(--curva)}
.mosaico__rotulo{font-stretch:115%;font-size:.7rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--vermelho)}
.mosaico__chamada{font-weight:700;font-size:clamp(1.25rem,1.9vw,2rem);line-height:1.05;letter-spacing:-.03em}

.mosaico.visivel .mosaico__grade>*{opacity:1;transform:none;transition-delay:calc(var(--ordem) * 45ms)}

/* legenda: o projeto em foco, lado a lado */
.mosaico__legenda{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 6px;margin-top:clamp(36px,6vh,64px);padding-top:22px;border-top:1px solid var(--tinta)}
.mosaico__legenda-info{grid-column:1/4;display:grid;align-content:start;gap:6px;font-stretch:115%;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.mosaico__legenda-info span:first-child{color:var(--vermelho)}
.mosaico__legenda-info span+span{color:var(--suave);font-weight:600}
.mosaico__legenda-nome{grid-column:4/9;font-weight:800;font-size:clamp(2rem,3.9vw,4.2rem);line-height:.95;letter-spacing:-.045em}
.mosaico__legenda-texto{grid-column:9/13;display:grid;align-content:start;gap:20px}
.mosaico__legenda-resumo{font-size:1rem;line-height:1.5;color:var(--suave)}
.mosaico__legenda-botao{justify-self:start;display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;background:var(--tinta);color:#fff;font-stretch:112%;font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;transition:background .4s var(--curva)}
.mosaico__legenda-botao:hover{background:var(--vermelho)}
.mosaico__legenda-botao b{transition:transform .5s var(--curva)}
.mosaico__legenda-botao:hover b{transform:translateX(4px)}
.mosaico__troca{transition:opacity .35s var(--curva),transform .5s var(--curva)}
.mosaico__legenda.trocando .mosaico__troca{opacity:0;transform:translateY(8px)}

/* índice: todos os nomes em linha, para achar e apontar */
.mosaico__indice{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:clamp(32px,5vh,52px);padding-top:18px;border-top:1px solid var(--linha);list-style:none}
.mosaico__indice a{font-size:.95rem;font-weight:600;letter-spacing:-.01em;color:var(--suave);transition:color .3s}
.mosaico__indice a.ativo,.mosaico__indice a:hover{color:var(--tinta);box-shadow:0 2px 0 var(--vermelho)}

@media (max-width:760px){
  .mosaico__grade{--colunas:5;--vao:4px}
  .mosaico__legenda{grid-template-columns:1fr;gap:16px}
  .mosaico__legenda>*{grid-column:1/-1!important}
  .mosaico__legenda-nome{font-size:2.3rem}
  .mosaico__chamada{font-size:1.2rem}
  .mosaico__indice{gap:8px 18px}
}
</style>
</head>
<body>
<section class="mosaico" id="projetos" aria-labelledby="mosaico-titulo">
  <div class="mosaico__grade"></div>
  <div class="mosaico__legenda" aria-live="polite">
    <p class="mosaico__legenda-info mosaico__troca"><span></span><span></span></p>
    <h3 class="mosaico__legenda-nome mosaico__troca"></h3>
    <div class="mosaico__legenda-texto mosaico__troca">
      <p class="mosaico__legenda-resumo"></p>
      <a class="mosaico__legenda-botao" href="#">Ver o projeto <b aria-hidden="true">&rarr;</b></a>
    </div>
  </div>
  <ul class="mosaico__indice"></ul>
</section>

<script type="module">
const TRABALHOS = [{"nome": "Olha o Cabelo dela", "categoria": "Marca e apresentação", "tipo": "Book de captação", "ano": "2026", "cliente": "Tabuleiro Produções", "resumo": "Book de captação do Afrotour de Itana Rosa, projeto de circulação internacional entre Brasil e África.", "capa": "/assets/imagens/trabalhos/olha-o-cabelo-dela/capa.webp", "endereco": "/trabalhos/olha-o-cabelo-dela"}, {"nome": "Antropofagia Mapping", "categoria": "Marca e apresentação", "tipo": "Book de captação", "ano": "2025", "cliente": "Tabuleiro Produções", "resumo": "Book de captação de um projeto pensado a partir da preservação da natureza e da cultura, com grafismos que atravessam todas as peças.", "capa": "/assets/imagens/trabalhos/antropofagia-mapping/capa.webp", "endereco": "/trabalhos/antropofagia-mapping"}, {"nome": "Tabuleiro Produções", "categoria": "Marca e apresentação", "tipo": "Identidade visual", "ano": "2023 a 2026", "cliente": "Tabuleiro Produções", "resumo": "Os criativos da produtora com a mesma assinatura visual: portfólios de serviços, books de captação, sites, curso, livros e redes sociais.", "capa": "/assets/imagens/trabalhos/tabuleiro-producoes/capa.webp", "endereco": "/trabalhos/tabuleiro-producoes"}, {"nome": "Amazônia Motirô", "categoria": "Marca e apresentação", "tipo": "Book de captação", "ano": "", "cliente": "", "resumo": "Book de captação da ópera contemporânea, com o espetáculo, a circulação, as cotas e as contrapartidas para patrocinadores.", "capa": "/assets/imagens/trabalhos/amazonia-motiro/capa.webp", "endereco": "/trabalhos/amazonia-motiro"}, {"nome": "Orquestra Jovem do Recôncavo", "categoria": "Marca e apresentação", "tipo": "Book de captação", "ano": "2026", "cliente": "Tabuleiro Produções", "resumo": "Book de captação do plano anual da orquestra, com proposta, impacto, contrapartidas e cotas para patrocinadores.", "capa": "/assets/imagens/trabalhos/orquestra-jovem-do-reconcavo/capa.webp", "endereco": "/trabalhos/orquestra-jovem-do-reconcavo"}, {"nome": "Forró Zevixe", "categoria": "Marca e apresentação", "tipo": "Portfólio artístico", "ano": "", "cliente": "", "resumo": "Portfólio da banda com trajetória, ficha técnica, clipping e registros de shows.", "capa": "/assets/imagens/trabalhos/forro-zevixe/capa.webp", "endereco": "/trabalhos/forro-zevixe"}, {"nome": "Nanda Sabores e Afetos", "categoria": "Marca e apresentação", "tipo": "Identidade visual", "ano": "", "cliente": "", "resumo": "Identidade visual da confeitaria aplicada a cardápios, embalagens, cartão de visita e redes sociais.", "capa": "/assets/imagens/trabalhos/nanda-sabores-e-afetos/capa.webp", "endereco": "/trabalhos/nanda-sabores-e-afetos"}, {"nome": "Trombone Criativo", "categoria": "Web e redes", "tipo": "Landing page", "ano": "", "cliente": "", "resumo": "Página de venda do método de improvisação para trombone.", "capa": "/assets/imagens/trabalhos/trombone-criativo/capa.webp", "endereco": "/trabalhos/trombone-criativo"}, {"nome": "Duda Filmes", "categoria": "Web e redes", "tipo": "Site", "ano": "", "cliente": "", "resumo": "Site da produtora audiovisual, com projetos, apresentação e contato.", "capa": "/assets/imagens/trabalhos/duda-filmes/capa.webp", "endereco": "/trabalhos/duda-filmes"}, {"nome": "Festival de Roteiro", "categoria": "Web e redes", "tipo": "Site", "ano": "", "cliente": "", "resumo": "Site do Festival de Roteiro Audiovisual da Amazônia, com apresentação, laboratórios e inscrições.", "capa": "/assets/imagens/trabalhos/festival-de-roteiro/capa.webp", "endereco": "/trabalhos/festival-de-roteiro"}, {"nome": "Elas nas Telas", "categoria": "Web e redes", "tipo": "Site", "ano": "", "cliente": "", "resumo": "Site da mostra de cinema feito por mulheres, com edições, filmes premiados e inscrições.", "capa": "/assets/imagens/trabalhos/elas-nas-telas/capa.webp", "endereco": "/trabalhos/elas-nas-telas"}, {"nome": "Festival Periferia no ar", "categoria": "Web e redes", "tipo": "Site", "ano": "", "cliente": "", "resumo": "Site do festival de hip-hop com modalidades, entrevistas, inscrição e perguntas frequentes.", "capa": "/assets/imagens/trabalhos/festival-periferia-no-ar/capa.webp", "endereco": "/trabalhos/festival-periferia-no-ar"}, {"nome": "Ong Acuba", "categoria": "Web e redes", "tipo": "Site", "ano": "", "cliente": "", "resumo": "Site da ONG de arte e cultura urbana, com projetos, eventos e formas de apoio.", "capa": "/assets/imagens/trabalhos/ong-acuba/capa.webp", "endereco": "/trabalhos/ong-acuba"}];

/*
 * MAPAS DA GRADE
 * Cada linha é uma fileira de quadrados; cada caractere, uma célula.
 *   .  vazio          p  próximo projeto, na ordem do site
 *   F  canto do retrato (2 x 2)     t  início do título (3 x 1 no desktop)
 *   letra maiúscula de PROJETOS: a letra naquela célula
 * As letras se leem da esquerda para a direita, em escada.
 */
const MAPAS = {
  largo: {
    colunas: 12,
    titulo: 3,
    linhas: [
      "..t..F.p.p.p",
      "pPRp...ETp..",
      ".ppOJp.p.OSp",
      "....p...p...",
    ],
  },
  estreito: {
    colunas: 5,
    titulo: 3,
    linhas: [
      "t..p.",
      "pPROp",
      "F.pJE",
      "..TOp",
      "pSppp",
      "pp.pp",
    ],
  },
};

const CORES = ["vermelho", "tinta", "cinza", "vermelho", "tinta", "vermelho", "cinza", "tinta"];

class MosaicoDeProjetos {
  constructor(secao, trabalhos) {
    this.secao = secao;
    this.grade = secao.querySelector(".mosaico__grade");
    this.legenda = secao.querySelector(".mosaico__legenda");
    this.trabalhos = trabalhos;
    this.ativo = -1;
    this.criarPecas();
    this.consulta = matchMedia("(max-width: 760px)");
    this.consulta.addEventListener("change", () => this.posicionar());
    this.posicionar();
    this.ativar(0, false);
    this.observarEntrada();
  }

  criarPecas() {
    const g = this.grade;
    this.titulo = Object.assign(document.createElement("div"), { className: "mosaico__titulo" });
    this.titulo.innerHTML = '<span class="mosaico__rotulo">Trabalhos selecionados</span><h2 class="mosaico__chamada" id="mosaico-titulo">Cultura que vira imagem, um projeto por quadrado</h2>';
    this.retrato = Object.assign(document.createElement("div"), { className: "mosaico__retrato" });
    this.retrato.innerHTML = '<img src="/assets/imagens/retrato-pb.webp" alt="Josah Oliveira">';
    this.letras = [..."PROJETOS"].map((l, i) => {
      const el = document.createElement("div");
      el.className = `mosaico__letra mosaico__letra--${CORES[i]}`;
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = `<span>${l}</span>`;
      el.dataset.letra = l;
      return el;
    });
    this.projetos = this.trabalhos.map((t, i) => {
      const a = document.createElement("a");
      a.className = "mosaico__projeto";
      a.href = t.endereco;
      a.setAttribute("aria-label", `${t.nome}, ${t.tipo}`);
      a.innerHTML = `<img src="${t.capa}" alt="" loading="lazy">`;
      a.addEventListener("pointerenter", (e) => e.pointerType === "mouse" && this.ativar(i));
      a.addEventListener("focus", () => this.ativar(i));
      a.addEventListener("click", (e) => {
        if (this.toque && this.ativo !== i) { e.preventDefault(); this.ativar(i); }
      });
      a.addEventListener("pointerdown", (e) => { this.toque = e.pointerType !== "mouse"; });
      return a;
    });
    g.append(this.titulo, this.retrato, ...this.letras, ...this.projetos);

    const indice = this.secao.querySelector(".mosaico__indice");
    this.nomes = this.trabalhos.map((t, i) => {
      const li = document.createElement("li");
      const a = Object.assign(document.createElement("a"), { href: t.endereco, textContent: t.nome });
      a.addEventListener("pointerenter", () => this.ativar(i));
      a.addEventListener("focus", () => this.ativar(i));
      li.append(a);
      indice.append(li);
      return a;
    });
  }

  /* lê o mapa e põe cada peça na sua célula exata */
  posicionar() {
    const mapa = this.consulta.matches ? MAPAS.estreito : MAPAS.largo;
    this.grade.style.setProperty("--colunas", mapa.colunas);
    const letras = [...this.letras];
    let p = 0, ordem = 0;
    const por = (el, coluna, linha, largura = 1, altura = 1) => {
      el.style.gridColumn = `${coluna} / span ${largura}`;
      el.style.gridRow = `${linha} / span ${altura}`;
      el.style.setProperty("--ordem", ordem++);
    };
    mapa.linhas.forEach((fileira, r) => {
      [...fileira].forEach((c, k) => {
        const coluna = k + 1, linha = r + 1;
        if (c === "p") por(this.projetos[p++], coluna, linha);
        else if (c === "F") por(this.retrato, coluna, linha, 2, 2);
        else if (c === "t") por(this.titulo, coluna, linha, mapa.titulo, 1);
        else if (c !== ".") por(letras.find((l) => l.dataset.letra === c && !l._usada && (l._usada = true)), coluna, linha);
      });
    });
    letras.forEach((l) => delete l._usada);
    if (p !== this.projetos.length) console.warn("mapa com", p, "projetos de", this.projetos.length);
  }

  ativar(i, animar = true) {
    if (i === this.ativo) return;
    this.projetos[this.ativo]?.classList.remove("ativo");
    this.nomes[this.ativo]?.classList.remove("ativo");
    this.ativo = i;
    this.projetos[i].classList.add("ativo");
    this.nomes[i].classList.add("ativo");
    const t = this.trabalhos[i];
    const escrever = () => {
      const [cat, extra] = this.legenda.querySelectorAll(".mosaico__legenda-info span");
      cat.textContent = t.categoria;
      extra.textContent = [t.tipo, t.ano].filter(Boolean).join(", ");
      this.legenda.querySelector(".mosaico__legenda-nome").textContent = t.nome;
      this.legenda.querySelector(".mosaico__legenda-resumo").textContent = t.resumo;
      this.legenda.querySelector(".mosaico__legenda-botao").href = t.endereco;
      this.legenda.classList.remove("trocando");
    };
    if (!animar) return escrever();
    clearTimeout(this.espera);
    this.legenda.classList.add("trocando");
    this.espera = setTimeout(escrever, 180);
  }

  observarEntrada() {
    new IntersectionObserver((itens, obs) => {
      if (itens[0].isIntersecting) { this.secao.classList.add("visivel"); obs.disconnect(); }
    }, { threshold: 0.15 }).observe(this.grade);
  }
}

new MosaicoDeProjetos(document.querySelector(".mosaico"), TRABALHOS);
</script>
</body>
</html>
