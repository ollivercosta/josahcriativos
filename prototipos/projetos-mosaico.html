<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo: mosaico de projetos</title>
<style>
@font-face{font-family:"Archivo";src:url("/assets/fontes/archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}
:root{--tinta:#16130f;--cinza:#eeece8;--suave:rgba(22,19,15,.62);--linha:rgba(22,19,15,.14);--margem:4.4vw;--curva:cubic-bezier(.16,1,.3,1);
  --verde:#6aab3c;--azul:#16879a;--amarelo:#f2b318;--laranja:#ec7a22;--magenta:#d02f68}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--tinta);font-family:"Archivo",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.mosaico{padding:clamp(72px,11vh,120px) var(--margem) 64px}

/* a grade: células 4:3, a proporção das capas; nada da capa fica de fora */
.mosaico__grade{--colunas:12;--vao:3px;container-type:inline-size;display:grid;grid-template-columns:repeat(var(--colunas),minmax(0,1fr));grid-auto-rows:calc((100cqw - (var(--colunas) - 1) * var(--vao)) / var(--colunas) * .75);gap:var(--vao);position:relative}
.mosaico__grade>*{min-width:0;opacity:0;transform:translateY(12px);transition:opacity .8s var(--curva),transform .8s var(--curva)}
.mosaico.visivel .mosaico__grade>*{opacity:1;transform:none;transition-delay:calc(var(--ordem) * 40ms)}

/* letras: branco sobre cor, como blocos impressos */
.mosaico__letra{display:grid;place-items:center;overflow:hidden;container-type:size;color:#fff}
.mosaico__letra span{font-weight:800;font-stretch:108%;font-size:104cqh;line-height:.72;letter-spacing:-.03em;transform:translateY(5%)}
.mosaico__letra--verde{background:var(--verde)}
.mosaico__letra--azul{background:var(--azul)}
.mosaico__letra--amarelo{background:var(--amarelo)}
.mosaico__letra--laranja{background:var(--laranja)}
.mosaico__letra--magenta{background:var(--magenta)}

/* projetos: preto e branco; em foco, a cor volta e o quadro sobe */
.mosaico__projeto{position:relative;display:block;overflow:hidden;background:var(--cinza);outline:none}
.mosaico__projeto img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .6s var(--curva),transform 1s var(--curva)}
.mosaico.visivel .mosaico__projeto{transition:opacity .8s var(--curva),transform .6s var(--curva),box-shadow .6s var(--curva)}
.mosaico__projeto.ativo{z-index:2;transform:scale(1.06)!important;box-shadow:0 18px 40px -12px rgba(22,19,15,.45)}
.mosaico__projeto.ativo img{filter:none}
.mosaico__projeto:focus-visible{box-shadow:0 0 0 3px var(--tinta)}

/* retrato: 2 x 2, o fundo branco some sobre o cinza e a cabeça passa da borda */
.mosaico__retrato{position:relative;background:var(--cinza);clip-path:inset(-40% 0 0 0)}
.mosaico__retrato img{position:absolute;left:50%;bottom:0;height:116%;width:auto;transform:translateX(-50%);mix-blend-mode:multiply;pointer-events:none}

/* título dentro da grade */
.mosaico__titulo{align-self:end;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:0 12px 10px 0}
.mosaico__rotulo{font-stretch:115%;font-size:.66rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--suave)}
.mosaico__chamada{font-weight:700;font-size:clamp(1.1rem,1.6vw,1.7rem);line-height:1.05;letter-spacing:-.03em}

/* legenda: o projeto em foco, lado a lado, logo abaixo da grade */
.mosaico__legenda{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,5fr) minmax(0,4fr);gap:0 3px;margin-top:28px;padding-top:18px;border-top:1px solid var(--tinta)}
.mosaico__legenda-info{display:grid;align-content:start;gap:6px;font-stretch:115%;font-size:.66rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.mosaico__legenda-info span+span{color:var(--suave);font-weight:600}
.mosaico__legenda-nome{font-weight:800;font-size:clamp(1.8rem,2.9vw,3rem);line-height:.98;letter-spacing:-.04em;padding-right:24px}
.mosaico__legenda-texto{display:grid;align-content:start;gap:16px}
.mosaico__legenda-resumo{font-size:.95rem;line-height:1.5;color:var(--suave)}
.mosaico__legenda-botao{justify-self:start;display:inline-flex;align-items:center;gap:12px;padding:12px 20px;border-radius:999px;background:var(--tinta);color:#fff;font-stretch:112%;font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.mosaico__legenda-botao b{transition:transform .5s var(--curva)}
.mosaico__legenda-botao:hover b{transform:translateX(4px)}
.mosaico__troca{transition:opacity .3s var(--curva),transform .45s var(--curva)}
.mosaico__legenda.trocando .mosaico__troca{opacity:0;transform:translateY(6px)}

/* índice: todos os nomes em linha */
.mosaico__indice{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px;padding-top:14px;border-top:1px solid var(--linha);list-style:none}
.mosaico__indice a{font-size:.88rem;font-weight:600;color:var(--suave);transition:color .3s}
.mosaico__indice a.ativo,.mosaico__indice a:hover{color:var(--tinta);box-shadow:0 2px 0 var(--tinta)}

@media (max-width:760px){
  .mosaico{padding-top:56px}
  .mosaico__grade{--colunas:5;--vao:2px}
  .mosaico__retrato{clip-path:inset(0)}
  .mosaico__retrato img{height:100%}
  .mosaico__titulo{padding-right:6px}
  .mosaico__chamada{font-size:1.02rem}
  .mosaico__legenda{grid-template-columns:1fr;gap:12px;margin-top:20px}
  .mosaico__legenda-nome{font-size:2rem}
  .mosaico__indice{gap:6px 16px}
}
</style>
</head>
<body>
<section class="mosaico" id="projetos" aria-labelledby="mosaico-titulo">
  <div class="mosaico__grade"></div>
  <div class="mosaico__legenda" aria-live="polite">
    <p class="mosaico__legenda-info mosaico__troca"><span></span><span></span></p>
    <h3 class="mosaico__legenda-nome mosaico__troca"></h3>
    <div class="mosaico__legenda-texto mosaico__troca">
      <p class="mosaico__legenda-resumo"></p>
      <a class="mosaico__legenda-botao" href="#">Ver o projeto <b aria-hidden="true">&rarr;</b></a>
    </div>
  </div>
  <ul class="mosaico__indice"></ul>
</section>

<script type="module">
const TRABALHOS = [{"nome":"Olha o Cabelo dela","destaque":true,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"2026","cliente":"Tabuleiro Produções","resumo":"Book de captação do Afrotour de Itana Rosa, projeto de circulação internacional entre Brasil e África.","capa":"/assets/imagens/trabalhos/olha-o-cabelo-dela/capa.webp","endereco":"/trabalhos/olha-o-cabelo-dela"},{"nome":"Antropofagia Mapping","destaque":true,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"2025","cliente":"Tabuleiro Produções","resumo":"Book de captação de um projeto pensado a partir da preservação da natureza e da cultura, com grafismos que atravessam todas as peças.","capa":"/assets/imagens/trabalhos/antropofagia-mapping/capa.webp","endereco":"/trabalhos/antropofagia-mapping"},{"nome":"Tabuleiro Produções","destaque":true,"categoria":"Marca e apresentação","tipo":"Identidade visual","ano":"2023 a 2026","cliente":"Tabuleiro Produções","resumo":"Os criativos da produtora com a mesma assinatura visual: portfólios de serviços, books de captação, sites, curso, livros e redes sociais.","capa":"/assets/imagens/trabalhos/tabuleiro-producoes/capa.webp","endereco":"/trabalhos/tabuleiro-producoes"},{"nome":"Amazônia Motirô","destaque":false,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"","cliente":"","resumo":"Book de captação da ópera contemporânea, com o espetáculo, a circulação, as cotas e as contrapartidas para patrocinadores.","capa":"/assets/imagens/trabalhos/amazonia-motiro/capa.webp","endereco":"/trabalhos/amazonia-motiro"},{"nome":"Orquestra Jovem do Recôncavo","destaque":false,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"2026","cliente":"Tabuleiro Produções","resumo":"Book de captação do plano anual da orquestra, com proposta, impacto, contrapartidas e cotas para patrocinadores.","capa":"/assets/imagens/trabalhos/orquestra-jovem-do-reconcavo/capa.webp","endereco":"/trabalhos/orquestra-jovem-do-reconcavo"},{"nome":"Forró Zevixe","destaque":false,"categoria":"Marca e apresentação","tipo":"Portfólio artístico","ano":"","cliente":"","resumo":"Portfólio da banda com trajetória, ficha técnica, clipping e registros de shows.","capa":"/assets/imagens/trabalhos/forro-zevixe/capa.webp","endereco":"/trabalhos/forro-zevixe"},{"nome":"Nanda Sabores e Afetos","destaque":false,"categoria":"Marca e apresentação","tipo":"Identidade visual","ano":"","cliente":"","resumo":"Identidade visual da confeitaria aplicada a cardápios, embalagens, cartão de visita e redes sociais.","capa":"/assets/imagens/trabalhos/nanda-sabores-e-afetos/capa.webp","endereco":"/trabalhos/nanda-sabores-e-afetos"},{"nome":"Trombone Criativo","destaque":false,"categoria":"Web e redes","tipo":"Landing page","ano":"","cliente":"","resumo":"Página de venda do método de improvisação para trombone.","capa":"/assets/imagens/trabalhos/trombone-criativo/capa.webp","endereco":"/trabalhos/trombone-criativo"},{"nome":"Duda Filmes","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site da produtora audiovisual, com projetos, apresentação e contato.","capa":"/assets/imagens/trabalhos/duda-filmes/capa.webp","endereco":"/trabalhos/duda-filmes"},{"nome":"Festival de Roteiro","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site do Festival de Roteiro Audiovisual da Amazônia, com apresentação, laboratórios e inscrições.","capa":"/assets/imagens/trabalhos/festival-de-roteiro/capa.webp","endereco":"/trabalhos/festival-de-roteiro"},{"nome":"Elas nas Telas","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site da mostra de cinema feito por mulheres, com edições, filmes premiados e inscrições.","capa":"/assets/imagens/trabalhos/elas-nas-telas/capa.webp","endereco":"/trabalhos/elas-nas-telas"},{"nome":"Festival Periferia no ar","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site do festival de hip-hop com modalidades, entrevistas, inscrição e perguntas frequentes.","capa":"/assets/imagens/trabalhos/festival-periferia-no-ar/capa.webp","endereco":"/trabalhos/festival-periferia-no-ar"},{"nome":"Ong Acuba","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site da ONG de arte e cultura urbana, com projetos, eventos e formas de apoio.","capa":"/assets/imagens/trabalhos/ong-acuba/capa.webp","endereco":"/trabalhos/ong-acuba"}];

/*
 * MAPAS DA GRADE
 * Cada linha é uma fileira de células 4:3; cada caractere, uma célula.
 *   .  vazio
 *   p  projeto em 1 x 1             G  projeto em destaque, 2 x 2
 *   F  retrato, 2 x 2               t  título (largura em "titulo")
 *   #  e -  células ocupadas pelo G, pelo F ou pelo título
 *   letra maiúscula de PROJETOS: a letra naquela célula
 * As letras se leem da esquerda para a direita, aos pares: PR, OJ, ET, OS.
 */
const MAPAS = {
  largo: {
    colunas: 12,
    titulo: 3,
    linhas: [
      ".t--pF#ppG#.",
      "pPRpp##ET##.",
      "G#ppOJG#ppOS",
      "##....##....",
    ],
  },
  estreito: {
    colunas: 5,
    titulo: 3,
    linhas: [
      "t--pp",
      "PRF#p",
      "pO##J",
      "G#ETp",
      "##pOS",
      "G#pG#",
      "##p##",
      "pp...",
    ],
  },
};

const CORES = ["verde", "azul", "laranja", "amarelo", "magenta", "azul", "verde", "laranja"];

class MosaicoDeProjetos {
  constructor(secao, trabalhos) {
    this.secao = secao;
    this.grade = secao.querySelector(".mosaico__grade");
    this.legenda = secao.querySelector(".mosaico__legenda");
    this.trabalhos = trabalhos;
    this.ativo = -1;
    this.criarPecas();
    this.consulta = matchMedia("(max-width: 760px)");
    this.consulta.addEventListener("change", () => this.posicionar());
    this.posicionar();
    this.ativar(0, false);
    this.observarEntrada();
  }

  criarPecas() {
    const g = this.grade;
    this.titulo = Object.assign(document.createElement("div"), { className: "mosaico__titulo" });
    this.titulo.innerHTML = '<span class="mosaico__rotulo">Trabalhos selecionados</span><h2 class="mosaico__chamada" id="mosaico-titulo">Cultura que vira imagem, um projeto por quadrado</h2>';
    this.retrato = Object.assign(document.createElement("div"), { className: "mosaico__retrato" });
    this.retrato.innerHTML = '<img src="/assets/imagens/retrato-pb.webp" alt="Josah Oliveira">';
    this.letras = [..."PROJETOS"].map((l, i) => {
      const el = document.createElement("div");
      el.className = `mosaico__letra mosaico__letra--${CORES[i]}`;
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = `<span>${l}</span>`;
      el.dataset.letra = l;
      return el;
    });
    this.projetos = this.trabalhos.map((t, i) => {
      const a = document.createElement("a");
      a.className = "mosaico__projeto";
      a.href = t.endereco;
      a.setAttribute("aria-label", `${t.nome}, ${t.tipo}`);
      a.innerHTML = `<img src="${t.capa}" alt="" loading="lazy">`;
      a.addEventListener("pointerenter", (e) => e.pointerType === "mouse" && this.ativar(i));
      a.addEventListener("focus", () => this.ativar(i));
      a.addEventListener("click", (e) => {
        if (this.toque && this.ativo !== i) { e.preventDefault(); this.ativar(i); }
      });
      a.addEventListener("pointerdown", (e) => { this.toque = e.pointerType !== "mouse"; });
      return a;
    });
    g.append(this.titulo, this.retrato, ...this.letras, ...this.projetos);

    const indice = this.secao.querySelector(".mosaico__indice");
    this.nomes = this.trabalhos.map((t, i) => {
      const li = document.createElement("li");
      const a = Object.assign(document.createElement("a"), { href: t.endereco, textContent: t.nome });
      a.addEventListener("pointerenter", () => this.ativar(i));
      a.addEventListener("focus", () => this.ativar(i));
      li.append(a);
      indice.append(li);
      return a;
    });
  }

  /* lê o mapa e põe cada peça na sua célula exata */
  posicionar() {
    const mapa = this.consulta.matches ? MAPAS.estreito : MAPAS.largo;
    this.grade.style.setProperty("--colunas", mapa.colunas);
    const letras = [...this.letras];
    const destaques = this.trabalhos.filter((t) => t.destaque).length;
    let g = 0, p = destaques, ordem = 0;
    const por = (el, coluna, linha, largura = 1, altura = 1) => {
      el.style.gridColumn = `${coluna} / span ${largura}`;
      el.style.gridRow = `${linha} / span ${altura}`;
      el.style.setProperty("--ordem", ordem++);
    };
    mapa.linhas.forEach((fileira, r) => {
      [...fileira].forEach((c, k) => {
        const coluna = k + 1, linha = r + 1;
        if (c === "p") por(this.projetos[p++], coluna, linha);
        else if (c === "G") por(this.projetos[g++], coluna, linha, 2, 2);
        else if (c === "F") por(this.retrato, coluna, linha, 2, 2);
        else if (c === "t") por(this.titulo, coluna, linha, mapa.titulo, 1);
        else if (/[A-Z]/.test(c)) por(letras.find((l) => l.dataset.letra === c && !l._usada && (l._usada = true)), coluna, linha);
      });
    });
    letras.forEach((l) => delete l._usada);
    if (g !== destaques || p !== this.projetos.length) console.warn("mapa não fecha:", g, "destaques e", p - destaques, "projetos");
  }

  ativar(i, animar = true) {
    if (i === this.ativo) return;
    this.projetos[this.ativo]?.classList.remove("ativo");
    this.nomes[this.ativo]?.classList.remove("ativo");
    this.ativo = i;
    this.projetos[i].classList.add("ativo");
    this.nomes[i].classList.add("ativo");
    const t = this.trabalhos[i];
    const escrever = () => {
      const [cat, extra] = this.legenda.querySelectorAll(".mosaico__legenda-info span");
      cat.textContent = t.categoria;
      extra.textContent = [t.tipo, t.ano].filter(Boolean).join(", ");
      this.legenda.querySelector(".mosaico__legenda-nome").textContent = t.nome;
      this.legenda.querySelector(".mosaico__legenda-resumo").textContent = t.resumo;
      this.legenda.querySelector(".mosaico__legenda-botao").href = t.endereco;
      this.legenda.classList.remove("trocando");
    };
    if (!animar) return escrever();
    clearTimeout(this.espera);
    this.legenda.classList.add("trocando");
    this.espera = setTimeout(escrever, 180);
  }

  observarEntrada() {
    new IntersectionObserver((itens, obs) => {
      if (itens[0].isIntersecting) { this.secao.classList.add("visivel"); obs.disconnect(); }
    }, { threshold: 0.15 }).observe(this.grade);
  }
}

new MosaicoDeProjetos(document.querySelector(".mosaico"), TRABALHOS);
</script>
</body>
</html>
