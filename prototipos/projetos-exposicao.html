<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo: parede de exposição</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("/assets/fontes/archivo.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-display: block;
  }

  :root {
    --tinta: #16130f;
    --vermelho: #a3171f;
    --parede: #f3f2ef;
    --suave: rgba(22, 19, 15, 0.62);
    --linha: rgba(22, 19, 15, 0.14);
    --margem: 4.4vw;
    --curva: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: var(--tinta); font-family: "Archivo", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  .expo { padding: 90px 0 120px; }

  .expo__cabeca {
    display: grid;
    grid-template-columns: auto minmax(4vw, 1fr);
    align-items: last baseline;
    gap: 2vw;
    padding: 0 var(--margem) 48px;
  }

  .expo__titulo { font-weight: 900; font-size: 8vw; line-height: 0.84; letter-spacing: -0.06em; }
  .expo__titulo em { font-style: normal; color: var(--vermelho); }
  .expo__barra { height: max(5px, 0.6vw); background: var(--tinta); }

  .expo__filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 26px;
    margin: 0 var(--margem);
    padding-bottom: 18px;
    border-bottom: 1px solid var(--tinta);
  }

  .expo__filtro {
    position: relative;
    padding: 6px 0;
    border: 0;
    background: none;
    color: var(--suave);
    font: inherit;
    font-stretch: 115%;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .expo__filtro[aria-pressed="true"] { color: var(--tinta); box-shadow: 0 2px 0 var(--vermelho); }

  /* a parede: as peças penduradas em duas alturas, todas à vista */
  .expo__parede {
    margin: 40px var(--margem) 0;
    padding: clamp(36px, 4vw, 64px) clamp(28px, 3.4vw, 56px) clamp(28px, 3vw, 48px);
    background: var(--parede);
  }

  .expo__fileira {
    display: grid;
    gap: clamp(28px, 2.6vw, 44px) clamp(20px, 2vw, 32px);
    list-style: none;
  }

  .expo__fileira--destaques { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .expo__fileira--demais { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: clamp(40px, 4vw, 64px); }

  /* a peça: a capa inteira, 4:3, impressa, com a etiqueta embaixo */
  .expo__peca {
    display: grid;
    gap: 14px;
    opacity: 0;
    transform: translate3d(0, 24px, 0);
    transition: opacity 0.9s var(--curva), transform 0.9s var(--curva);
    transition-delay: calc(var(--ordem) * 60ms);
  }

  .expo--visivel .expo__peca { opacity: 1; transform: none; }

  .expo__peca--apagada { opacity: 0.18 !important; pointer-events: none; transition-delay: 0ms; }

  .expo__quadro {
    position: relative;
    display: block;
    aspect-ratio: 4 / 3;
    background: #fff;
    transition: transform 0.6s var(--curva);
  }

  /* a sombra fica numa camada própria: no hover só a opacidade dela muda */
  .expo__quadro::before,
  .expo__quadro::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    transition: opacity 0.6s var(--curva);
  }

  .expo__quadro::before {
    box-shadow:
      0 1px 1px rgba(22, 19, 15, 0.08),
      0 8px 16px -8px rgba(22, 19, 15, 0.22);
  }

  .expo__quadro::after {
    box-shadow:
      0 2px 2px rgba(22, 19, 15, 0.06),
      0 30px 50px -18px rgba(22, 19, 15, 0.42);
    opacity: 0;
  }

  .expo__imagem { display: block; width: 100%; height: 100%; object-fit: contain; }

  .expo__ver {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    background: var(--tinta);
    color: #fff;
    font-stretch: 112%;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    transform: translate3d(0, 6px, 0);
    transition: opacity 0.4s var(--curva), transform 0.5s var(--curva);
  }

  /* etiqueta de museu: nome, tipo e ano */
  .expo__etiqueta { display: grid; gap: 4px; padding-left: 12px; border-left: 2px solid var(--tinta); transition: border-color 0.4s; }
  .expo__nome { font-weight: 700; font-size: 1rem; line-height: 1.15; letter-spacing: -0.015em; }
  .expo__fileira--destaques .expo__nome { font-size: clamp(1.1rem, 1.5vw, 1.45rem); }
  .expo__info { font-stretch: 112%; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--suave); }
  .expo__selo { color: var(--vermelho); font-weight: 700; }

  @media (hover: hover) and (pointer: fine) {
    .expo__peca:hover .expo__quadro { transform: translate3d(0, -8px, 0); }
    .expo__peca:hover .expo__quadro::after { opacity: 1; }
    .expo__peca:hover .expo__ver { opacity: 1; transform: none; }
    .expo__peca:hover .expo__etiqueta { border-color: var(--vermelho); }
  }

  .expo__peca:focus-visible { outline: none; }
  .expo__peca:focus-visible .expo__quadro { outline: 2px solid var(--tinta); outline-offset: 4px; }

  @media (max-width: 860px) {
    .expo__titulo { font-size: 2.6rem; }
    .expo__barra { display: none; }
    .expo__filtros { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 20px; margin: 0; padding: 0 var(--margem) 10px; }
    .expo__filtro { flex: none; white-space: nowrap; }
    .expo__parede { margin: 24px 0 0; padding: 28px var(--margem); }
    .expo__fileira--destaques { grid-template-columns: 1fr; gap: 32px; }
    .expo__fileira--demais { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; margin-top: 40px; }
    .expo__nome { font-size: 0.92rem; }
  }
</style>
</head>
<body>
  <section class="expo" id="projetos">
    <div class="expo__cabeca">
      <h2 class="expo__titulo">Alguns <em>trabalhos.</em></h2>
      <span class="expo__barra" aria-hidden="true"></span>
    </div>
    <div class="expo__filtros" role="group" aria-label="Filtrar trabalhos"></div>
    <div class="expo__parede">
      <ul class="expo__fileira expo__fileira--destaques"></ul>
      <ul class="expo__fileira expo__fileira--demais"></ul>
    </div>
  </section>

<script type="module">
  const TRABALHOS = [{"nome":"Olha o Cabelo dela","destaque":true,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"2026","cliente":"Tabuleiro Produções","resumo":"Book de captação do Afrotour de Itana Rosa, projeto de circulação internacional entre Brasil e África.","capa":"/assets/imagens/trabalhos/olha-o-cabelo-dela/capa.webp","endereco":"/trabalhos/olha-o-cabelo-dela"},{"nome":"Antropofagia Mapping","destaque":true,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"2025","cliente":"Tabuleiro Produções","resumo":"Book de captação de um projeto pensado a partir da preservação da natureza e da cultura, com grafismos que atravessam todas as peças.","capa":"/assets/imagens/trabalhos/antropofagia-mapping/capa.webp","endereco":"/trabalhos/antropofagia-mapping"},{"nome":"Tabuleiro Produções","destaque":true,"categoria":"Marca e apresentação","tipo":"Identidade visual","ano":"2023 a 2026","cliente":"Tabuleiro Produções","resumo":"Os criativos da produtora com a mesma assinatura visual: portfólios de serviços, books de captação, sites, curso, livros e redes sociais.","capa":"/assets/imagens/trabalhos/tabuleiro-producoes/capa.webp","endereco":"/trabalhos/tabuleiro-producoes"},{"nome":"Amazônia Motirô","destaque":false,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"","cliente":"","resumo":"Book de captação da ópera contemporânea, com o espetáculo, a circulação, as cotas e as contrapartidas para patrocinadores.","capa":"/assets/imagens/trabalhos/amazonia-motiro/capa.webp","endereco":"/trabalhos/amazonia-motiro"},{"nome":"Orquestra Jovem do Recôncavo","destaque":false,"categoria":"Marca e apresentação","tipo":"Book de captação","ano":"2026","cliente":"Tabuleiro Produções","resumo":"Book de captação do plano anual da orquestra, com proposta, impacto, contrapartidas e cotas para patrocinadores.","capa":"/assets/imagens/trabalhos/orquestra-jovem-do-reconcavo/capa.webp","endereco":"/trabalhos/orquestra-jovem-do-reconcavo"},{"nome":"Forró Zevixe","destaque":false,"categoria":"Marca e apresentação","tipo":"Portfólio artístico","ano":"","cliente":"","resumo":"Portfólio da banda com trajetória, ficha técnica, clipping e registros de shows.","capa":"/assets/imagens/trabalhos/forro-zevixe/capa.webp","endereco":"/trabalhos/forro-zevixe"},{"nome":"Nanda Sabores e Afetos","destaque":false,"categoria":"Marca e apresentação","tipo":"Identidade visual","ano":"","cliente":"","resumo":"Identidade visual da confeitaria aplicada a cardápios, embalagens, cartão de visita e redes sociais.","capa":"/assets/imagens/trabalhos/nanda-sabores-e-afetos/capa.webp","endereco":"/trabalhos/nanda-sabores-e-afetos"},{"nome":"Trombone Criativo","destaque":false,"categoria":"Web e redes","tipo":"Landing page","ano":"","cliente":"","resumo":"Página de venda do método de improvisação para trombone.","capa":"/assets/imagens/trabalhos/trombone-criativo/capa.webp","endereco":"/trabalhos/trombone-criativo"},{"nome":"Duda Filmes","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site da produtora audiovisual, com projetos, apresentação e contato.","capa":"/assets/imagens/trabalhos/duda-filmes/capa.webp","endereco":"/trabalhos/duda-filmes"},{"nome":"Festival de Roteiro","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site do Festival de Roteiro Audiovisual da Amazônia, com apresentação, laboratórios e inscrições.","capa":"/assets/imagens/trabalhos/festival-de-roteiro/capa.webp","endereco":"/trabalhos/festival-de-roteiro"},{"nome":"Elas nas Telas","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site da mostra de cinema feito por mulheres, com edições, filmes premiados e inscrições.","capa":"/assets/imagens/trabalhos/elas-nas-telas/capa.webp","endereco":"/trabalhos/elas-nas-telas"},{"nome":"Festival Periferia no ar","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site do festival de hip-hop com modalidades, entrevistas, inscrição e perguntas frequentes.","capa":"/assets/imagens/trabalhos/festival-periferia-no-ar/capa.webp","endereco":"/trabalhos/festival-periferia-no-ar"},{"nome":"Ong Acuba","destaque":false,"categoria":"Web e redes","tipo":"Site","ano":"","cliente":"","resumo":"Site da ONG de arte e cultura urbana, com projetos, eventos e formas de apoio.","capa":"/assets/imagens/trabalhos/ong-acuba/capa.webp","endereco":"/trabalhos/ong-acuba"}];

  class ParedeDeTrabalhos {
    constructor(secao, trabalhos) {
      this.secao = secao;
      this.trabalhos = trabalhos;
      this.pecas = [];
      const destaques = secao.querySelector(".expo__fileira--destaques");
      const demais = secao.querySelector(".expo__fileira--demais");
      trabalhos.forEach((t, i) => (t.destaque ? destaques : demais).append(this.criarPeca(t, i)));
      this.criarFiltros();
      new IntersectionObserver(([e], obs) => {
        if (e.isIntersecting) { secao.classList.add("expo--visivel"); obs.disconnect(); }
      }, { threshold: 0.12 }).observe(secao.querySelector(".expo__parede"));
    }

    criarPeca(t, i) {
      const li = document.createElement("li");
      li.innerHTML = `
        <a class="expo__peca" href="${t.endereco}" style="--ordem:${i}">
          <span class="expo__quadro">
            <img class="expo__imagem" src="${t.capa}" alt="" loading="lazy" decoding="async">
            <span class="expo__ver" aria-hidden="true">Ver o projeto &rarr;</span>
          </span>
          <span class="expo__etiqueta">
            <span class="expo__nome">${t.nome}</span>
            <span class="expo__info">${[t.tipo, t.ano].filter(Boolean).join(", ")}${t.destaque ? ' <span class="expo__selo">Destaque</span>' : ""}</span>
          </span>
        </a>`;
      const peca = li.firstElementChild;
      peca.dataset.categoria = t.categoria;
      this.pecas.push(peca);
      return li;
    }

    criarFiltros() {
      const caixa = this.secao.querySelector(".expo__filtros");
      const categorias = ["Todos", ...new Set(this.trabalhos.map((t) => t.categoria))];
      for (const c of categorias) {
        const b = document.createElement("button");
        b.className = "expo__filtro";
        b.type = "button";
        b.textContent = c;
        b.setAttribute("aria-pressed", c === "Todos" ? "true" : "false");
        b.addEventListener("click", () => {
          for (const outro of caixa.children) outro.setAttribute("aria-pressed", outro === b ? "true" : "false");
          /* as peças não mudam de lugar: as de fora da categoria se apagam */
          for (const p of this.pecas) {
            const fora = c !== "Todos" && p.dataset.categoria !== c;
            p.classList.toggle("expo__peca--apagada", fora);
            p.tabIndex = fora ? -1 : 0;
          }
        });
        caixa.append(b);
      }
    }
  }

  new ParedeDeTrabalhos(document.querySelector(".expo"), TRABALHOS);
</script>
</body>
</html>
