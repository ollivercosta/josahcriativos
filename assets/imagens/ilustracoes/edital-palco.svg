<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 50 935 330" role="img" aria-label="Do edital ao palco: uma designer trabalha numa prancheta, com o edital e a régua de logos de um lado e o palco iluminado do outro">
  <style>
    .fluxo { animation: fluxo 2.4s linear infinite; }
    .foco { animation: foco 4s ease-in-out infinite alternate; }
    @keyframes fluxo { to { stroke-dashoffset: -22; } }
    @keyframes foco { from { opacity: .75; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fluxo, .foco { animation: none; } }
  </style>
  <defs>
    <linearGradient id="fundoBolha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B3E7A"/><stop offset="1" stop-color="#062F5F"/></linearGradient>
    <linearGradient id="areia" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A8"/><stop offset="1" stop-color="#E9C977"/></linearGradient>
    <linearGradient id="arbusto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C7FC4"/><stop offset="1" stop-color="#173F7A"/></linearGradient>
    <linearGradient id="arbusto2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B6BAE"/><stop offset="1" stop-color="#0F2F60"/></linearGradient>
    <linearGradient id="cortina" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E1B1B"/><stop offset=".5" stop-color="#D23A2E"/><stop offset="1" stop-color="#9F1F1F"/></linearGradient>
    <linearGradient id="tablado" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E1B45A"/><stop offset="1" stop-color="#B07F2E"/></linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4C8" stop-opacity=".85"/><stop offset="1" stop-color="#FFF4C8" stop-opacity="0"/></linearGradient>
    <linearGradient id="blusa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC93D"/><stop offset="1" stop-color="#F0A800"/></linearGradient>
    <linearGradient id="cabelo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D3E7C"/><stop offset="1" stop-color="#0A1F45"/></linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B866"/><stop offset="1" stop-color="#C58E3C"/></linearGradient>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C62828"/><stop offset="1" stop-color="#7E1515"/></linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".55"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- bolhas de fundo -->
  <path d="M70 360 C40 250 120 150 250 140 C330 134 360 70 470 64 C600 58 650 140 760 130 C880 120 930 230 900 360 Z" fill="url(#fundoBolha)"/>
  <path d="M250 360 C230 290 300 220 380 226 C440 230 470 190 540 196 C620 204 660 262 640 360 Z" fill="url(#areia)" opacity=".92"/>

  <!-- arbustos da esquerda -->
  <g>
    <path d="M78 362 C54 342 58 300 84 292 C80 262 108 244 130 258 C150 240 182 258 176 286 C202 296 200 340 176 362 Z" fill="url(#arbusto)"/>
    <path d="M128 362 V282 M128 330 L108 312 M128 312 L148 296" stroke="#0A1F45" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- edital: folhas, selo e régua de logos -->
  <g transform="translate(176 216) rotate(-6)">
    <rect x="10" y="8" width="96" height="124" rx="6" fill="#DCE6F5"/>
    <rect x="0" y="0" width="96" height="124" rx="6" fill="#FFFFFF"/>
    <rect x="12" y="14" width="52" height="7" rx="3.5" fill="#1B2A3A"/>
    <g fill="#B9C6D8"><rect x="12" y="30" width="72" height="4" rx="2"/><rect x="12" y="40" width="64" height="4" rx="2"/><rect x="12" y="50" width="70" height="4" rx="2"/><rect x="12" y="60" width="48" height="4" rx="2"/></g>
    <g><rect x="12" y="98" width="16" height="12" rx="2" fill="#1B2A3A"/><rect x="32" y="98" width="16" height="12" rx="2" fill="#C62828"/><rect x="52" y="98" width="16" height="12" rx="2" fill="#C79A42"/><rect x="72" y="98" width="12" height="12" rx="2" fill="#6B88B5"/></g>
    <circle cx="74" cy="78" r="12" fill="#C79A42"/><circle cx="74" cy="78" r="7" fill="none" stroke="#FFF4C8" stroke-width="1.6"/>
  </g>

  <!-- caminho tracejado: do edital à prancheta e da prancheta ao palco -->
  <path class="fluxo" d="M286 230 C320 200 350 196 380 214 M560 196 C600 160 640 150 690 170" fill="none" stroke="#FFBC00" stroke-width="2.4" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- prancheta com a designer -->
  <g>
    <path d="M372 360 L392 268 M520 360 L500 268" stroke="#8A5A1E" stroke-width="7" stroke-linecap="round"/>
    <path d="M360 270 L534 252 L540 266 L366 286 Z" fill="url(#mesa)"/>
    <!-- tela com o cartaz -->
    <rect x="404" y="176" width="92" height="74" rx="6" fill="#0A1F45"/>
    <rect x="410" y="182" width="80" height="62" rx="3" fill="url(#tela)"/>
    <circle cx="468" cy="206" r="14" fill="#FFBC00"/>
    <rect x="416" y="222" width="36" height="6" rx="3" fill="#FFF4E0"/><rect x="416" y="232" width="24" height="4" rx="2" fill="#FFF4E0" opacity=".7"/>
    <path d="M444 250 L440 262 H462 L456 250 Z" fill="#0A1F45"/>
    <!-- designer: sentada num banco alto, de perfil, voltada para a tela -->
    <g>
      <!-- banco -->
      <path d="M566 306 L560 362 M606 306 L614 362 M572 336 H604" stroke="#7A4A16" stroke-width="5" stroke-linecap="round"/>
      <rect x="556" y="298" width="58" height="10" rx="5" fill="#A86C26"/>
      <!-- pernas -->
      <path d="M596 300 C580 300 556 300 540 304" stroke="#1B2A3A" stroke-width="20" stroke-linecap="round" fill="none"/>
      <path d="M542 304 C538 324 536 340 538 354" stroke="#1B2A3A" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M528 352 C534 348 548 348 556 354 C556 360 548 362 528 362 Z" fill="#F6F1EA"/>
      <path d="M528 358 H556" stroke="#C62828" stroke-width="2.5"/>
      <!-- cabelo atrás -->
      <path d="M584 178 C606 180 616 206 612 236 C610 256 616 270 624 280 C604 284 590 270 588 250 Z" fill="url(#cabelo)"/>
      <!-- tronco -->
      <path d="M560 236 C566 222 594 220 604 236 C612 256 612 284 606 304 C590 310 570 310 560 304 C556 282 556 254 560 236 Z" fill="url(#blusa)"/>
      <path d="M560 284 C574 288 594 288 608 284" stroke="#FFFFFF" stroke-width="4" opacity=".85" fill="none"/>
      <!-- braço até a mesa -->
      <path d="M572 240 C560 254 548 262 528 262" stroke="#F0A800" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M560 254 L548 262" stroke="#FFFFFF" stroke-width="3" opacity=".85"/>
      <circle cx="522" cy="262" r="6.5" fill="#B9774E"/>
      <path d="M516 262 L506 270" stroke="#1B2A3A" stroke-width="3" stroke-linecap="round"/>
      <!-- pescoço e rosto de perfil -->
      <rect x="572" y="210" width="12" height="16" rx="5" fill="#B9774E"/>
      <path d="M566 182 C566 168 578 160 590 162 C600 164 604 176 602 188 C600 200 594 210 584 212 C576 214 570 208 568 202 L562 198 L566 192 Z" fill="#C98A64"/>
      <circle cx="574" cy="186" r="1.8" fill="#0A1F45"/>
      <path d="M570 202 C573 203 576 203 578 201" stroke="#8A4E33" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <!-- cabelo frente -->
      <path d="M566 182 C562 160 590 150 604 166 C612 176 610 196 604 206 C602 190 594 176 578 176 C574 178 570 180 566 182 Z" fill="url(#cabelo)"/>
    </g>
  </g>

  <!-- palco -->
  <g>
    <path class="foco" d="M766 116 L790 116 L846 322 L708 322 Z" fill="url(#luz)"/>
    <rect x="764" y="110" width="28" height="12" rx="4" fill="#0A1F45"/>
    <ellipse class="foco" cx="775" cy="320" rx="84" ry="14" fill="url(#brilho)"/>
    <rect x="680" y="320" width="196" height="40" rx="6" fill="url(#tablado)"/>
    <rect x="680" y="320" width="196" height="8" rx="4" fill="#F2CE7A"/>
    <path d="M672 96 C690 160 684 250 696 330 L664 330 C660 250 660 160 672 96 Z" fill="url(#cortina)"/>
    <path d="M886 96 C868 160 874 250 862 330 L894 330 C898 250 898 160 886 96 Z" fill="url(#cortina)"/>
    <path d="M660 90 H898 V112 C860 124 820 106 780 116 C740 126 700 108 660 118 Z" fill="#8E1B1B"/>
    <!-- banner do evento no fundo do palco -->
    <rect x="732" y="150" width="88" height="112" rx="4" fill="#FFFFFF"/>
    <rect x="740" y="158" width="72" height="54" rx="2" fill="#0B3E7A"/>
    <circle cx="790" cy="178" r="12" fill="#FFBC00"/>
    <rect x="740" y="220" width="46" height="7" rx="3.5" fill="#1B2A3A"/><rect x="740" y="232" width="34" height="4" rx="2" fill="#B9C6D8"/>
    <g fill="#B9C6D8"><rect x="740" y="248" width="12" height="8" rx="1.5"/><rect x="756" y="248" width="12" height="8" rx="1.5"/><rect x="772" y="248" width="12" height="8" rx="1.5"/></g>
    <!-- microfone -->
    <path d="M846 320 V256" stroke="#0A1F45" stroke-width="3"/><rect x="841" y="244" width="10" height="16" rx="5" fill="#0A1F45"/>
  </g>

  <!-- arbusto da direita -->
  <g>
    <path d="M902 364 C884 346 886 312 904 304 C902 282 924 270 940 282 C958 276 970 300 958 318 C972 334 964 356 948 364 Z" fill="url(#arbusto2)"/>
    <path d="M926 364 V300 M926 336 L912 322" stroke="#0A1F45" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- chão -->
  <ellipse cx="480" cy="364" rx="430" ry="12" fill="#001D40" opacity=".55"/>
</svg>
