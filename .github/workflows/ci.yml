name: Verificações

on:
  push:
  pull_request:

# o token do GitHub nas verificações só lê o repositório
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, fixada por commit
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, fixada por commit
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Build e teste do chat
        run: npm test
      # qualquer aviso, de qualquer grau, reprova
      - name: Auditoria de dependências
        run: npm audit --audit-level=low
